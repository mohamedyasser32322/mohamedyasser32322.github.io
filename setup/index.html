<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحويل إلى ديمو أساس…</title>
  <script>
    // The Asas demo lives at /asas-demo/. If an old cached build bounced here,
    // forward to the demo with a fresh query string to bypass the browser cache
    // (a new URL key = fresh fetch = no redirect loop).
    (function () {
      var target = '/asas-demo/?fresh=' + Date.now();
      try { location.replace(target); } catch (e) { location.href = target; }
    })();
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a0b10;color:#eef0f6;
      min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:420px}
    .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.12);border-top-color:#38e8c5;
      border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.15rem;font-weight:700}
    p{color:#a3a8b8;font-size:.95rem}
    a.btn{margin-top:6px;display:inline-block;padding:12px 26px;border-radius:999px;font-weight:700;
      color:#04140f;background:linear-gradient(135deg,#38e8c5,#6c8cff);text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>جارٍ تحويلك إلى النسخة التجريبية…</h1>
    <p>لو لم يتم التحويل تلقائياً، اضغط الزر:</p>
    <a class="btn" href="/asas-demo/?fresh=1">افتح ديمو أساس</a>
  </div>
</body>
</html>
